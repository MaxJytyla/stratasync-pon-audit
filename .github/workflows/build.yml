name: Build

on:
  push:
    branches: [main, rust-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r sheets_bridge/requirements.txt
      - name: Sheets bridge tests
        run: python -m unittest discover -s sheets_bridge/tests -t . -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: App tests
        run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StrataSync-PON-Audit-Windows
            path: dist/StrataSync PON Audit.exe
          - os: macos-latest
            artifact: StrataSync-PON-Audit-macOS
            path: dist/StrataSync-PON-Audit-macOS.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the sheets bridge (Python)
        run: |
          python -m pip install -r sheets_bridge/requirements-build.txt
          python sheets_bridge/build.py

      - name: Test on this platform
        run: cargo test --locked

      - name: Build the app (Windows, with the bridge embedded)
        if: runner.os == 'Windows'
        env:
          SHEETS_BRIDGE_EMBED: ${{ github.workspace }}/dist/sheets-bridge.exe
        run: |
          cargo test --locked embedded
          cargo build --release --locked
          cp target/release/stratasync-pon-audit.exe "dist/StrataSync PON Audit.exe"

      - name: Build the app (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked
          packaging/macos/make_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv "artifacts/StrataSync-PON-Audit-Windows/StrataSync PON Audit.exe" StrataSync-PON-Audit-Windows.exe
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            StrataSync-PON-Audit-Windows.exe \
            artifacts/StrataSync-PON-Audit-macOS/StrataSync-PON-Audit-macOS.zip

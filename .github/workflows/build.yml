name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StrataSync-PON-Audit-Windows
            path: dist/StrataSync PON Audit.exe
          - os: macos-latest
            artifact: StrataSync-PON-Audit-macOS
            path: dist/StrataSync-PON-Audit-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-build.txt
      - name: Open the window (smoke test)
        run: python scripts/smoke_gui.py
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv "artifacts/StrataSync-PON-Audit-Windows/StrataSync PON Audit.exe" StrataSync-PON-Audit-Windows.exe
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            StrataSync-PON-Audit-Windows.exe \
            artifacts/StrataSync-PON-Audit-macOS/StrataSync-PON-Audit-macOS.zip
